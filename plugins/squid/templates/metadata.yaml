apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-terra-metadata
  labels:
    kuiper.juno-innovations.com/chart: "{{ .Release.Name }}-scripts-configmap"
  annotations:
    juno-innovations.com/workload: "Server"
data:
  chart: "{{ .Release.Name }}-scripts-configmap"
  description: "VPN-routed Squid HTTP proxy. Forwards HTTP/HTTPS traffic from other workloads through a VPN tunnel, tunneled via gluetun."
  fields: |
    - name: icon
      default: "https://raw.githubusercontent.com/aldmbmtl/Terra-Cyber/refs/heads/main/plugins/squid/assets/logo.png"
    - name: vpnProvider
      type: select
      required: true
      description: "VPN provider"
      options:
        - airvpn
        - cyberghost
        - expressvpn
        - fastestvpn
        - giganews
        - hidemyass
        - ipvanish
        - ivpn
        - nordvpn
        - perfect privacy
        - privado
        - private internet access
        - privatevpn
        - protonvpn
        - purevpn
        - slickvpn
        - surfshark
        - torguard
        - vpnsecure
        - vpn unlimited
        - vyprvpn
        - windscribe
    - name: serverCountries
      type: string
      required: true
      description: "Comma-separated country names to connect through (e.g. Canada, United States)"
    - name: firewallSubnets
      type: string
      required: false
      default: "0.0.0.0/0"
      description: "Outbound subnets allowed through the VPN. Default routes all traffic through the tunnel."
    - name: openvpnUser
      type: string
      required: true
      description: "OpenVPN service username"
    - name: openvpnPassword
      type: string
      required: true
      description: "OpenVPN service password"
  env_hints: |
    - name: TZ
      description: Timezone for the proxy containers, e.g. "America/New_York".
