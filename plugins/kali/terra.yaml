resource_id: kali
name: Kali
icon: https://raw.githubusercontent.com/juno-fx/Terra-Official-Plugins/refs/heads/main/plugins/kali/assets/logo.png
description: Kali Linux workload with integrated wetty terminal and tmux session persistence.
category: Development
tags:
  - cluster-level
  - development
  - workload
  - terminal
fields:
  - name: registry
    description: Container registry to pull the Kali image from.
    type: string
    required: true
    default: "kalilinux"
  - name: repo
    description: Image repository name within the registry.
    type: string
    required: true
    default: "kali"
  - name: tag
    description: Image tag to deploy.
    type: string
    required: true
    default: "latest"
  - name: host
    description: Hostname used for the ingress route to the terminal.
    type: string
    required: true
  - name: packages
    description: Space-separated list of extra apt packages to install at launch.
    type: string
    required: false
    default: "vim"