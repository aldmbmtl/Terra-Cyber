apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-terra-metadata
  labels:
    kuiper.juno-innovations.com/chart: "{{ .Release.Name }}-scripts-configmap"
  annotations:
    juno-innovations.com/workload: "Terminal"
data:
  chart: "{{ .Release.Name }}-scripts-configmap"
  description: "Kali Linux workload with integrated wetty terminal and tmux session persistence."
  fields: |
    - name: registry
      type: string
      required: true
      default: "kalilinux"
    - name: repo
      type: string
      required: true
      default: "kali"
    - name: tag
      type: string
      required: true
      default: "latest"
    - name: packages
      type: string
      required: false
      default: "vim"
      description: "Space-separated apt packages to install in the Kali image"
    - name: icon
      default: "https://raw.githubusercontent.com/aldmbmtl/Terra-Cyber/refs/heads/main/plugins/kali/assets/logo.png"
  # Generic shell-session variables useful to anything run in the Kali terminal
  # (wetty/tmux shell — not an application with its own env).
  env_hints: |
    - name: TZ
      description: Timezone for the shell session, e.g. "America/New_York".
    - name: EDITOR
      description: Default text editor invoked by CLI tools (e.g. vim, nano).
