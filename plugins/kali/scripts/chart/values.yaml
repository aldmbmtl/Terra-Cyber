# Default config values — field names MUST exactly match
# templates/metadata.yaml data.fields: names (Rule 9)

# Kuiper-injected standard values — do not remove
name: kali
user: kali
group:
cpu: "1"
memory: "1Gi"
cpuLimit: null
memoryLimit: null
idx: 0
guid: 0
puid: 0
host:
pullSecret:
session:
volumeMounts: []
volumes: []
env:
  - name: JUNO
    value: "true"
selector:
plugins: []
_kuiper:

# Kali-specific user-facing fields
registry: kalilinux
repo: kali-rolling
tag: latest

# Packages to install in the Kali image (space-separated)
packages: vim
