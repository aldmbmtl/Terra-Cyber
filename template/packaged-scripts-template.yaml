# Base template for packaged-scripts.yaml
# This file is used by `make package` to generate the ConfigMap YAML
# containing the base64-encoded scripts/ directory.
#
# The generated ConfigMap is read by Genesis (Kuiper). The key shape here is
# REQUIRED: Genesis looks up `packaged_scripts.base64` (base64-gzipped tar of
# scripts/, root = `scripts/chart/` for workload templates) and `bootstrap.sh`.
# Any other key layout (e.g. a single `packaged_scripts` key) makes Genesis
# skip the workload schema entirely. Mirror the official plugin generator.

apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-scripts-configmap
  labels:
    kuiper.juno-innovations.com/chart: "{{ .Release.Name }}-scripts-configmap"
data:
  bootstrap.sh: |
    #!/bin/bash
    echo "Unpacking scripts..."
    # decode base64 encoded scripts mount at /terra/scripts.base64
    base64 -d /terra/scripts.base64 > /terra/scripts.tar.gz

    # extract scripts to /terra/scripts
    tar -xzvf /terra/scripts.tar.gz -C /terra/

    # make scripts executable
    chmod +x -v /terra/scripts/*.sh

    # start entrypoint.sh
    cd /terra/scripts
    ./entrypoint.sh
  packaged_scripts.base64: "{{ .Values.packaged_scripts_base64 }}"
